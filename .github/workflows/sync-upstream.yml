name: Sync Ruflo upstream

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ruflo-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'dcanario-wq/ruflo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge upstream main without overwriting local changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/merge-upstream" -f branch=main
